# Canonical label set. `sync.sh apply labels` creates/updates these and deletes any other label; the label-guard workflow deletes non-standard labels as soon as they are created.
# Type
- {name: bug, color: d73a4a, description: "Something isn't working"}
- {name: enhancement, color: a2eeef, description: "New feature or request"}
- {name: documentation, color: 0075ca, description: "Improvements or additions to documentation"}
- {name: question, color: d876e3, description: "Further information is requested"}
- {name: wontfix, color: ffffff, description: "This will not be worked on"}
- {name: invalid, color: e4e669, description: "This doesn't seem right"}
- {name: duplicate, color: cfd3d7, description: "This issue or pull request already exists"}
# Priority
- {name: P1, color: b60205, description: "Do first: blocks shipping or a known risk"}
- {name: P2, color: d93f0b, description: "Important, next up"}
- {name: P3, color: fbca04, description: "Nice to have"}
# Cross-cutting
- {name: parity, color: 0e8a16, description: "Gap between harnesses (Claude Code, Copilot CLI) or hosts (macOS, Linux, Windows)"}
# Automation (Dependabot, release-please)
- {name: dependencies, color: 0366d6, description: "Pull requests that update a dependency file"}
- {name: github_actions, color: "000000", description: "Pull requests that update GitHub Actions code"}
- {name: javascript, color: 168700, description: "Pull requests that update javascript code"}
- {name: python, color: 2b67c6, description: "Pull requests that update python code"}
- {name: "python:uv", color: 2b67c6, description: "Pull requests that update python:uv code"}
- {name: todo, color: fbca04, description: "Created from a TODO comment by automation"}
- {name: "autorelease: pending", color: ededed, description: "release-please: release PR open"}
- {name: "autorelease: tagged", color: ededed, description: "release-please: tagged release"}
- {name: drift, color: b60205, description: "A repo deviates from the GitHub standard"}
