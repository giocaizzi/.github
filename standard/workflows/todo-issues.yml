name: TODO issues

# Copied verbatim into every repo by `sync.sh apply workflows`.
# Opens a `todo` issue for each to-do comment a push to the default branch adds, and closes it when the comment is removed.
# Triggers on pushes to `main` or `master` only, so other branches start no run; the job-level `if` keeps it to the
# default branch of the two (`branches:` cannot read the default branch).
# Bootstrap: a manual run (`gh workflow run todo-issues.yml`) imports the ones added since the first commit;
# an issue with the same title (open or closed) is never duplicated.
# Never write the uppercase keyword in a comment here: the action would turn that line into an issue.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  todo:
    # the default branch only
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && '0' || '1' }}
      - id: root
        if: github.event_name == 'workflow_dispatch'
        run: echo "sha=$(git rev-list --max-parents=0 HEAD | tail -1)" >> "$GITHUB_OUTPUT"
      - uses: alstr/todo-to-issue-action@37bb7b56e58569ef273b60678048030a7f0c261a # v5.1.15
        with:
          IDENTIFIERS: '[{"name": "TODO", "labels": ["todo"]}]'
        env:
          MANUAL_COMMIT_REF: ${{ steps.root.outputs.sha && github.sha || '' }}
          MANUAL_BASE_REF: ${{ steps.root.outputs.sha }}
