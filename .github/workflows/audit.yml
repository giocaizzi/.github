name: Audit

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # AUDIT_TOKEN: fine-grained PAT, read-only "Administration", "Contents", "Issues", "Secrets" + "Metadata" on all repos.
      # Public repos only: this repo, its artifact and its issues are public. Private repos are audited locally.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.2" # the workflow checker runs on uv (scripts/workflow.py and its lock)
      - name: Audit public repos
        env:
          GH_TOKEN: ${{ secrets.AUDIT_TOKEN }}
        run: |
          set +e
          scripts/sync.sh audit --json --visibility public > audit.json 2> audit.txt
          rc=$?
          cat audit.txt
          # 1 = drift (open/update the issue); anything else = the audit itself broke
          [ "$rc" = 1 ] && echo "drift=1" >> "$GITHUB_ENV"
          [ "$rc" = 0 ] || [ "$rc" = 1 ]
      # Latest JSON for the dashboard: GET repos/giocaizzi/.github/actions/artifacts?name=audit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit
          path: audit.json
          retention-days: 90
      - name: Render the report
        run: |
          uv run --quiet --script scripts/report.py --date "$(date -u +%F)" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" < audit.json > report.md
      # The report is the issue body, edited in place each run (no comments); an open issue is edited even without drift so it never goes stale
      - name: Open or update the drift issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --label drift --state open --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue edit "$n" --body-file report.md
          elif [ "${drift:-}" = 1 ]; then gh issue create --title "Standard drift" --label drift --body-file report.md; fi
