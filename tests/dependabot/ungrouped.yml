version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: bundler # quoted key, only a security group, not the last entry
    directory: /
    commit-message:
      prefix: "chore(deps)"
    groups:
      security:
        "applies-to": security-updates
        patterns: ["*"]
  - package-ecosystem: npm # no groups: one PR per dependency
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: pip # empty groups block
    directory: /
    groups:
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: gomod # only a security group: version updates ungrouped
    directory: /
    commit-message:
      prefix: "Bump"
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      sec-flow: {applies-to: security-updates, patterns: ["*"]}
      sec-quoted: {"applies-to": "security-updates"}
