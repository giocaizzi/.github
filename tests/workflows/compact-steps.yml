# steps not indented under `steps:` (valid YAML); a step's timeout-minutes is not the job's; expected: compact-steps.out
on: workflow_dispatch
permissions:
  contents: read
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - timeout-minutes: 5
      run: echo
    - uses: owner/action@main
