# norm mode blanks only the plain `uses: owner/repo@ref` form; any other spelling stays, so a copy using it is drift
on: workflow_dispatch
permissions:
  contents: read
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - "uses": actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - {uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1} # v7.0.1
