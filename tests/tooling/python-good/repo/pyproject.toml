[project]
name = "acme-app"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["httpx>=0.28"]

[dependency-groups]
dev = ["pytest>=9", "pytest-cov>=7", "pytest-xdist>=3.8", "mypy>=2", "ruff>=0.17"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "ISC001"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
addopts = "--cov"

[tool.coverage.report]
fail_under = 90
